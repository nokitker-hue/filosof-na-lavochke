<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c12">
<meta name="description" content="Философ на лавочке — медитативная экзистенциальная визуальная новелла о выгоревшем программисте, озере и людях, которые рядом.">
<title>Философ на лавочке</title>
<style>
/* ============================================================
   ПЕРЕМЕННЫЕ И БАЗА
   ============================================================ */
:root{
  --ink:#f4eee5;
  --muted:#c0b5a6;
  --faint:rgba(244,238,229,.55);
  --accent:#e8b271;
  --accent-2:#9fc8c9;
  --danger:#8fb0cf;
  --line:rgba(255,255,255,.13);
  --panel:rgba(9,11,17,.78);
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,"Times New Roman",serif;
  --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;

  /* Закат по умолчанию */
  --sky-1:#1d1030;
  --sky-2:#5c2848;
  --sky-3:#b85a45;
  --sky-4:#e7a267;
  --water-1:#4a2b3c;
  --water-2:#120c16;
  --cel-x:18%;
  --cel-y:54%;
  --cel-size:clamp(70px,10vw,130px);
  --cel-color:#ffd7a0;
  --cel-glow:rgba(255,150,90,.5);
  --cel-opacity:1;
  --stars-opacity:0;
  --fog-opacity:0;
  --rain-opacity:0;
}

*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:#0a0c12;
  color:var(--ink);
  font-family:var(--sans);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
[hidden]{display:none !important}
button{font-family:inherit}
::selection{background:rgba(232,178,113,.3)}

.sr-only{
  position:absolute!important;
  width:1px;height:1px;
  padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);
  white-space:nowrap;border:0;
}
.sprite-defs{
  position:absolute;
  width:0;height:0;
  overflow:hidden;
  pointer-events:none;
}

/* ============================================================
   ФОНЫ-ДЕКОРАЦИИ (только CSS, без картинок)
   ============================================================ */
body[data-bg="sunset"]{
  --sky-1:#1d1030; --sky-2:#5c2848; --sky-3:#b85a45; --sky-4:#e7a267;
  --water-1:#4a2b3c; --water-2:#120c16;
  --cel-x:18%; --cel-y:54%; --cel-size:clamp(70px,10vw,130px);
  --cel-color:#ffd7a0; --cel-glow:rgba(255,150,90,.5); --cel-opacity:1;
  --stars-opacity:0; --fog-opacity:0; --rain-opacity:0;
}
body[data-bg="night"]{
  --sky-1:#03050c; --sky-2:#071022; --sky-3:#0d1b31; --sky-4:#152943;
  --water-1:#0a1523; --water-2:#02050a;
  --cel-x:74%; --cel-y:16%; --cel-size:clamp(46px,6vw,80px);
  --cel-color:#e6edff; --cel-glow:rgba(170,200,255,.25); --cel-opacity:1;
  --stars-opacity:1; --fog-opacity:.1; --rain-opacity:0;
}
body[data-bg="dawn"]{
  --sky-1:#170f2c; --sky-2:#4a2a52; --sky-3:#b06a6d; --sky-4:#f0c08c;
  --water-1:#5a3a48; --water-2:#180f1a;
  --cel-x:24%; --cel-y:52%; --cel-size:clamp(60px,8vw,110px);
  --cel-color:#ffe0b3; --cel-glow:rgba(255,190,140,.38); --cel-opacity:1;
  --stars-opacity:.25; --fog-opacity:.25; --rain-opacity:0;
}
body[data-bg="rain"]{
  --sky-1:#161d25; --sky-2:#25313c; --sky-3:#3e4c57; --sky-4:#616f78;
  --water-1:#2b353d; --water-2:#0b0f13;
  --cel-x:20%; --cel-y:20%; --cel-size:clamp(60px,8vw,100px);
  --cel-color:#aab8c2; --cel-glow:rgba(160,180,200,.12); --cel-opacity:.22;
  --stars-opacity:0; --fog-opacity:.2; --rain-opacity:1;
}
body[data-bg="fog"]{
  --sky-1:#222a31; --sky-2:#39444d; --sky-3:#5f6d75; --sky-4:#8c989e;
  --water-1:#4b575e; --water-2:#171c20;
  --cel-x:50%; --cel-y:20%; --cel-size:clamp(90px,12vw,150px);
  --cel-color:#d9e1e4; --cel-glow:rgba(220,230,235,.18); --cel-opacity:.4;
  --stars-opacity:0; --fog-opacity:1; --rain-opacity:0;
}

.world{
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;
  background:#0a0c12;
  pointer-events:none;
}
.sky{
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 42%,var(--sky-3) 72%,var(--sky-4) 100%);
}
.celestial{
  position:absolute;
  left:var(--cel-x);
  top:var(--cel-y);
  width:var(--cel-size);
  aspect-ratio:1;
  border-radius:50%;
  background:var(--cel-color);
  box-shadow:0 0 90px 32px var(--cel-glow);
  opacity:var(--cel-opacity);
  transform:translate(-50%,-50%);
  transition:opacity 1.2s ease;
}
.stars{
  position:absolute;
  inset:0;
  opacity:var(--stars-opacity);
  transition:opacity 1.2s ease;
}
.star{
  position:absolute;
  display:block;
  border-radius:50%;
  background:#fff;
  opacity:.6;
  animation:twinkle var(--dur,3s) ease-in-out infinite alternate;
  animation-delay:var(--delay,0s);
}
@keyframes twinkle{
  from{opacity:.12;transform:scale(.8)}
  to{opacity:.85;transform:scale(1)}
}
.fog{
  position:absolute;
  inset:0;
  opacity:var(--fog-opacity);
  transition:opacity 1.4s ease;
  filter:blur(2px);
}
.fog span{
  position:absolute;
  display:block;
  width:72vw;
  height:34vh;
  border-radius:50%;
  background:rgba(224,234,238,.13);
  filter:blur(46px);
  animation:fogdrift 26s ease-in-out infinite alternate;
}
.fog span:nth-child(1){left:-12%;top:48%;animation-duration:29s}
.fog span:nth-child(2){right:-16%;top:24%;width:60vw;height:26vh;animation-duration:23s;animation-delay:-7s;background:rgba(230,238,241,.1)}
.fog span:nth-child(3){left:18%;bottom:6%;width:88vw;height:22vh;animation-duration:33s;animation-delay:-12s}
@keyframes fogdrift{
  from{transform:translate3d(-2%,0,0) scale(1)}
  to{transform:translate3d(3%,-2%,0) scale(1.08)}
}
.rain{
  position:absolute;
  inset:-18% 0 0;
  opacity:var(--rain-opacity);
  transition:opacity 1.2s ease;
}
.rain::before,
.rain::after{
  content:"";
  position:absolute;
  inset:0;
  background-image:repeating-linear-gradient(100deg,transparent 0 9px,rgba(208,224,234,.22) 9px 10px,transparent 10px 23px);
  animation:rainfall .65s linear infinite;
}
.rain::after{
  opacity:.45;
  animation-duration:1.05s;
  transform:translateX(14px);
}
@keyframes rainfall{
  from{transform:translate3d(0,-8%,0)}
  to{transform:translate3d(-5%,9%,0)}
}
.water{
  position:absolute;
  left:0;right:0;bottom:0;
  height:34%;
  background:linear-gradient(180deg,var(--water-1) 0%,var(--water-2) 100%);
  overflow:hidden;
}
.water::before{
  content:"";
  position:absolute;
  inset:0;
  background:repeating-linear-gradient(180deg,transparent 0 13px,rgba(255,255,255,.055) 14px,transparent 15px 29px);
  animation:waterdrift 16s linear infinite;
  opacity:.75;
}
.water::after{
  content:"";
  position:absolute;
  left:24%;right:12%;top:7%;
  height:2px;
  background:linear-gradient(90deg,transparent,var(--cel-glow),transparent);
  filter:blur(2px);
  opacity:.6;
  animation:shimmer 8s ease-in-out infinite alternate;
}
@keyframes waterdrift{
  from{transform:translateY(0)}
  to{transform:translateY(29px)}
}
@keyframes shimmer{
  from{opacity:.25;transform:translateX(-2%) scaleX(.8)}
  to{opacity:.75;transform:translateX(2%) scaleX(1.1)}
}
.grain{
  position:absolute;
  inset:0;
  opacity:.055;
  background-image:radial-gradient(rgba(255,255,255,.7) .5px,transparent .5px);
  background-size:3px 3px;
  mix-blend-mode:overlay;
}
.vignette{
  position:absolute;
  inset:0;
  background:radial-gradient(120% 85% at 50% 18%,transparent 42%,rgba(0,0,0,.62) 100%);
}

/* Лавочка и силуэт */
.bench{
  position:absolute;
  right:clamp(10px,7vw,140px);
  bottom:calc(34% - 2px);
  width:clamp(168px,21vw,292px);
  aspect-ratio:2.7/1;
  z-index:2;
  opacity:.94;
  filter:drop-shadow(0 20px 26px rgba(0,0,0,.4));
}
.bench .back{
  position:absolute;
  left:6%;right:12%;bottom:46%;
  height:31%;
  border-radius:8px 8px 3px 3px;
  background:#08070c;
}
.bench .back::after{
  content:"";
  position:absolute;
  inset:20% 8%;
  background:repeating-linear-gradient(180deg,transparent 0 6px,rgba(255,255,255,.055) 6px 8px);
}
.bench .seat{
  position:absolute;
  left:2%;right:8%;bottom:34%;
  height:9%;
  border-radius:4px;
  background:#0a090e;
}
.bench .leg{
  position:absolute;
  bottom:0;
  width:5%;
  height:38%;
  background:#07060a;
}
.bench .leg.l{left:10%}
.bench .leg.r{right:18%}
.bench .figure{
  position:absolute;
  right:19%;
  bottom:43%;
  width:21%;
  height:47%;
}
.bench .figure .head{
  position:absolute;
  left:50%;top:0;
  width:38%;
  aspect-ratio:1;
  border-radius:50%;
  background:#08070c;
  transform:translateX(-50%);
}
.bench .figure .body{
  position:absolute;
  left:50%;bottom:0;
  width:76%;height:70%;
  border-radius:44% 44% 10% 10%;
  background:#08070c;
  transform:translateX(-50%);
}

/* Удочка у воды — появляется в сценах с рыбалкой */
.rod{
  position:absolute;
  right:clamp(14px,15vw,230px);
  bottom:calc(34% - 8px);
  width:clamp(136px,17vw,230px);
  z-index:3;
  opacity:0;
  transform:translateY(10px) rotate(-1.5deg);
  transform-origin:50% 100%;
  transition:opacity .7s ease,transform .7s ease;
  pointer-events:none;
  filter:drop-shadow(0 14px 18px rgba(0,0,0,.35));
}
body.rod-out .rod{
  opacity:.96;
  transform:translateY(0) rotate(0deg);
}
.rod svg{display:block;width:100%;height:auto;overflow:visible}
.rod .float{
  transform-origin:200px 188px;
  animation:bob 4.2s ease-in-out infinite;
}
@keyframes bob{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(3px)}
}

/* ============================================================
   ИНТЕРФЕЙС
   ============================================================ */
.app{
  position:relative;
  z-index:2;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
}
.hud{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:.8rem;
  padding:clamp(.7rem,2.2vw,1.25rem) clamp(.85rem,3vw,1.8rem);
}
.brand{
  display:flex;
  flex-direction:column;
  gap:.25rem;
  min-width:0;
}
.brand-mark{
  font-family:var(--serif);
  font-size:clamp(.78rem,2.1vw,.95rem);
  letter-spacing:.17em;
  text-transform:uppercase;
  color:var(--muted);
  white-space:nowrap;
}
.dayline{
  font-size:.74rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--faint);
}
.controls{
  display:flex;
  align-items:center;
  gap:.4rem;
  flex-wrap:wrap;
  justify-content:flex-end;
}
.ghost{
  appearance:none;
  border:1px solid var(--line);
  background:rgba(8,10,14,.42);
  color:var(--ink);
  font-size:.78rem;
  letter-spacing:.02em;
  padding:.5rem .78rem;
  border-radius:999px;
  cursor:pointer;
  min-height:38px;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  transition:background .2s ease,border-color .2s ease,transform .2s ease;
}
.ghost:hover{
  background:rgba(232,178,113,.14);
  border-color:rgba(232,178,113,.45);
}
.ghost:active{transform:translateY(1px)}
.ghost:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ghost.is-armed{
  border-color:rgba(232,178,113,.75);
  background:rgba(232,178,113,.2);
}
.ghost .short{display:none}
.ghost.is-active{
  border-color:rgba(232,178,113,.6);
  background:rgba(232,178,113,.16);
}

.screen{
  flex:1;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding:0 clamp(.7rem,2.6vw,1.8rem) max(.9rem,env(safe-area-inset-bottom));
  min-height:0;
}
.panel{
  position:relative;
  width:min(880px,100%);
  max-height:calc(100dvh - 7.4rem);
  overflow-y:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  background:linear-gradient(180deg,rgba(13,16,24,.84),rgba(7,9,14,.92));
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05);
  backdrop-filter:blur(16px) saturate(120%);
  -webkit-backdrop-filter:blur(16px) saturate(120%);
  padding:clamp(.95rem,2.6vw,1.55rem) clamp(.95rem,3vw,1.7rem);
  transition:opacity .22s ease,transform .22s ease;
  scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,.18) transparent;
}
.panel::-webkit-scrollbar{width:6px}
.panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:99px}
.panel.is-leaving{
  opacity:0;
  transform:translateY(12px);
}
.panel::before{
  content:"";
  position:absolute;
  left:8%;right:8%;top:0;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);
}
.scene-meta{
  display:flex;
  align-items:center;
  gap:.7rem;
  min-height:1.6rem;
  margin-bottom:.65rem;
}
.portrait{
  flex:none;
  width:68px;height:68px;
  border-radius:18px;
  overflow:hidden;
  border:1px solid rgba(232,178,113,.34);
  background:#0d1218;
  box-shadow:0 10px 24px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.05);
  animation:portrait-in .35s ease both;
}
.portrait svg{display:block;width:100%;height:100%}
@keyframes portrait-in{
  from{opacity:0;transform:translateY(4px) scale(.97)}
  to{opacity:1;transform:none}
}
.speaker-block{
  display:flex;
  flex-direction:column;
  gap:.18rem;
  min-width:0;
}
.speaker{
  font-family:var(--serif);
  font-size:clamp(1rem,3.2vw,1.22rem);
  color:var(--accent);
  letter-spacing:.02em;
  line-height:1.15;
}
.speaker-role{
  font-size:.62rem;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--faint);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.scene-no{
  margin-left:auto;
  align-self:flex-start;
  padding-top:.15rem;
  font-size:.68rem;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--faint);
}
.text{
  margin:0;
  font-family:var(--serif);
  font-size:clamp(1.02rem,2.6vw,1.17rem);
  line-height:1.64;
  white-space:pre-line;
  min-height:5.2em;
  color:var(--ink);
}
.text.is-typing::after{
  content:"▌";
  margin-left:.12em;
  color:var(--accent);
  opacity:.65;
  animation:blink 1s steps(1) infinite;
}
@keyframes blink{
  50%{opacity:0}
}
.cast{
  display:flex;
  flex-wrap:wrap;
  gap:.4rem;
  margin-top:1rem;
}
.chip{
  display:inline-flex;
  align-items:center;
  gap:.45rem;
  padding:.28rem .58rem;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.045);
  color:var(--muted);
  font-size:.76rem;
  line-height:1.2;
  white-space:nowrap;
}
.chip .who{color:var(--ink);opacity:.88}
.chip-avatar{
  flex:none;
  display:block;
  width:18px;height:18px;
  border-radius:50%;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.14);
  background:#10161e;
}
.chip-avatar svg{display:block;width:100%;height:100%}
.pips{
  display:inline-flex;
  align-items:center;
  gap:2px;
}
.pip{
  display:block;
  width:5px;height:5px;
  border-radius:50%;
  background:rgba(255,255,255,.16);
}
.pip.on{
  background:var(--accent);
  box-shadow:0 0 6px rgba(232,178,113,.7);
}
.pip.on.neg{
  background:var(--danger);
  box-shadow:0 0 6px rgba(143,176,207,.7);
}

.choices{
  display:grid;
  gap:.5rem;
  margin-top:1.05rem;
  transition:opacity .25s ease,visibility .25s;
}
.choices.is-hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}
.choice{
  display:flex;
  align-items:flex-start;
  gap:.7rem;
  width:100%;
  min-height:48px;
  padding:.78rem .85rem;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.04);
  color:var(--ink);
  font-size:clamp(.93rem,2.45vw,1rem);
  line-height:1.36;
  text-align:left;
  cursor:pointer;
  transition:background .18s ease,border-color .18s ease,transform .18s ease;
  -webkit-tap-highlight-color:transparent;
}
.choice:hover{
  background:rgba(232,178,113,.11);
  border-color:rgba(232,178,113,.42);
  transform:translateY(-1px);
}
.choice:active{transform:translateY(0)}
.choice:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.choice .num{
  flex:none;
  display:grid;
  place-items:center;
  width:1.45rem;height:1.45rem;
  margin-top:-1px;
  border-radius:50%;
  border:1px solid rgba(232,178,113,.35);
  color:var(--accent);
  font-size:.75rem;
  font-variant-numeric:tabular-nums;
}
.choice .label{flex:1}
.choice.is-final{
  border-color:rgba(232,178,113,.28);
}
.choice.is-final .num{
  border-color:rgba(232,178,113,.6);
  background:rgba(232,178,113,.1);
}

/* Экран финала */
.ending-head{
  margin:.15rem 0 .75rem;
}
.kicker{
  display:inline-block;
  font-size:.66rem;
  letter-spacing:.24em;
  text-transform:uppercase;
  color:var(--accent);
  opacity:.85;
  margin-bottom:.35rem;
}
.ending-title{
  margin:0;
  font-family:var(--serif);
  font-weight:400;
  font-size:clamp(1.55rem,5.6vw,2.5rem);
  line-height:1.08;
  letter-spacing:.01em;
}
.ending-foot{
  margin-top:1.2rem;
  padding-top:1rem;
  border-top:1px solid rgba(255,255,255,.08);
}
.unlocked{
  font-size:.74rem;
  letter-spacing:.08em;
  color:var(--faint);
  margin-bottom:.75rem;
}
.ending-actions{
  display:flex;
  flex-wrap:wrap;
  gap:.55rem;
}
.primary{
  appearance:none;
  border:0;
  border-radius:999px;
  background:linear-gradient(180deg,#f0c489,#d99a55);
  color:#1b1208;
  font-size:.85rem;
  font-weight:600;
  letter-spacing:.03em;
  padding:.7rem 1.15rem;
  min-height:44px;
  cursor:pointer;
  transition:filter .2s ease,transform .2s ease;
}
.primary:hover{filter:brightness(1.06)}
.primary:active{transform:translateY(1px)}
.primary:focus-visible{outline:2px solid #fff;outline-offset:3px}

/* Галерея персонажей */
.gallery{
  position:fixed;
  inset:0;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:clamp(.7rem,3vw,2rem);
}
.gallery-backdrop{
  position:absolute;
  inset:0;
  background:rgba(3,5,9,.72);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
.gallery-panel{
  position:relative;
  width:min(960px,100%);
  max-height:min(86dvh,900px);
  display:flex;
  flex-direction:column;
  gap:.9rem;
  padding:clamp(1rem,2.8vw,1.6rem);
  border-radius:24px;
  border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(16,20,29,.97),rgba(7,9,14,.98));
  box-shadow:0 40px 110px rgba(0,0,0,.65);
  overflow:hidden;
}
.gallery-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:1rem;
}
.gallery-title{
  margin:0;
  font-family:var(--serif);
  font-weight:400;
  font-size:clamp(1.3rem,4vw,1.8rem);
  line-height:1.1;
}
.gallery-sub{
  margin-top:.3rem;
  font-size:.74rem;
  letter-spacing:.06em;
  color:var(--faint);
}
.gallery-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:.65rem;
  overflow-y:auto;
  padding-right:.2rem;
  scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,.18) transparent;
}
.gallery-grid::-webkit-scrollbar{width:6px}
.gallery-grid::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:99px}
.person-card{
  display:flex;
  align-items:center;
  gap:.7rem;
  padding:.65rem;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.09);
  background:rgba(255,255,255,.035);
  min-width:0;
}
.person-portrait{
  flex:none;
  width:70px;height:70px;
  border-radius:14px;
  overflow:hidden;
  border:1px solid rgba(232,178,113,.25);
  background:#0d1218;
}
.person-portrait svg{display:block;width:100%;height:100%}
.person-copy{min-width:0}
.person-name{
  margin:0;
  font-family:var(--serif);
  font-weight:400;
  font-size:.98rem;
  color:var(--ink);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.person-role{
  margin:.16rem 0 .3rem;
  font-size:.7rem;
  line-height:1.3;
  color:var(--muted);
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.person-card.is-locked{
  opacity:.62;
}
.person-card.is-locked .person-portrait{
  filter:grayscale(1) brightness(.3) blur(1.5px);
}
.person-card.is-locked .person-name{color:var(--muted)}
.person-card.is-locked .pips{visibility:hidden}

/* Сохранения */
.saves{
  position:fixed;
  inset:0;
  z-index:31;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:clamp(.7rem,3vw,2rem);
}
.saves-panel{
  position:relative;
  width:min(760px,100%);
  max-height:min(86dvh,820px);
  display:flex;
  flex-direction:column;
  gap:.9rem;
  padding:clamp(1rem,2.8vw,1.6rem);
  border-radius:24px;
  border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(16,20,29,.97),rgba(7,9,14,.98));
  box-shadow:0 40px 110px rgba(0,0,0,.65);
  overflow:hidden;
}
.saves-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:1rem;
}
.saves-title{
  margin:0;
  font-family:var(--serif);
  font-weight:400;
  font-size:clamp(1.3rem,4vw,1.8rem);
  line-height:1.1;
}
.saves-sub{
  margin-top:.3rem;
  font-size:.74rem;
  line-height:1.4;
  color:var(--faint);
}
.saves-list{
  display:grid;
  gap:.6rem;
  overflow-y:auto;
  padding-right:.2rem;
  scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,.18) transparent;
}
.saves-list::-webkit-scrollbar{width:6px}
.saves-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:99px}
.save-card{
  padding:.8rem .85rem;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.035);
}
.save-card.is-empty{
  border-style:dashed;
  opacity:.8;
}
.save-top{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:.5rem;
  margin-bottom:.35rem;
}
.save-slot{
  font-size:.66rem;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--accent);
}
.save-time{
  font-size:.68rem;
  color:var(--faint);
  white-space:nowrap;
}
.save-scene{
  margin:0;
  font-family:var(--serif);
  font-size:1rem;
  line-height:1.3;
}
.save-meta{
  margin-top:.2rem;
  font-size:.72rem;
  color:var(--muted);
}
.save-snippet{
  margin:.4rem 0 0;
  font-size:.7rem;
  line-height:1.4;
  color:var(--faint);
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.save-actions{
  display:flex;
  flex-wrap:wrap;
  gap:.4rem;
  margin-top:.6rem;
}
.primary.small{
  padding:.45rem .8rem;
  min-height:36px;
  font-size:.75rem;
}
.ghost.small{
  padding:.4rem .65rem;
  min-height:36px;
  font-size:.72rem;
}
.ghost.danger{
  color:#e6b3a6;
  border-color:rgba(200,120,100,.25);
}
.ghost.danger:hover{
  background:rgba(180,90,70,.16);
  border-color:rgba(200,120,100,.55);
}
.save-hint{
  margin:0;
  font-size:.7rem;
  line-height:1.45;
  color:var(--faint);
}

/* Тост */
.toast{
  position:fixed;
  left:50%;
  bottom:max(1rem,env(safe-area-inset-bottom));
  transform:translate(-50%,12px);
  z-index:40;
  max-width:min(92vw,560px);
  padding:.6rem 1rem;
  border-radius:999px;
  border:1px solid var(--line);
  background:rgba(10,13,20,.94);
  color:var(--ink);
  font-size:.8rem;
  line-height:1.3;
  text-align:center;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease,transform .25s ease;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
.toast.is-visible{
  opacity:1;
  transform:translate(-50%,0);
}

/* ============================================================
   АДАПТИВ
   ============================================================ */
@media (max-width:640px){
  .brand-mark{font-size:.72rem;letter-spacing:.12em}
  .dayline{font-size:.66rem}
  .ghost{font-size:.72rem;padding:.44rem .62rem;min-height:36px}
  .panel{max-height:calc(100dvh - 6.6rem);border-radius:18px}
  .bench{right:4%;bottom:calc(34% - 2px);width:46vw;opacity:.55}
  .rod{right:5%;width:38vw;bottom:calc(34% - 2px);opacity:0}
  body.rod-out .rod{opacity:.62}
  .vignette{background:radial-gradient(130% 80% at 50% 12%,transparent 38%,rgba(0,0,0,.66) 100%)}
  .text{min-height:4.4em}
  .portrait{width:58px;height:58px;border-radius:15px}
  .speaker-role{font-size:.58rem;letter-spacing:.12em}
  .gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .person-portrait{width:62px;height:62px}
}
@media (max-width:560px){
  .ghost .long{display:none}
  .ghost .short{display:inline}
  .gallery-grid{grid-template-columns:1fr}
  .gallery-panel{max-height:88dvh}
}
@media (max-width:420px){
  .hud{gap:.5rem;padding-top:.6rem}
  .brand-mark{display:none}
  .dayline{font-size:.68rem;letter-spacing:.14em}
  .controls{gap:.3rem}
  .screen{padding-left:.5rem;padding-right:.5rem}
  .panel{padding:.9rem .85rem;max-height:calc(100dvh - 5.9rem)}
  .choice{font-size:.92rem;padding:.72rem .75rem;min-height:46px}
  .chip{font-size:.7rem}
  .portrait{width:52px;height:52px;border-radius:13px}
  .scene-meta{gap:.55rem}
  .person-card{padding:.55rem}
  .person-portrait{width:58px;height:58px}
}
@media (max-height:520px) and (orientation:landscape){
  .hud{padding-top:.4rem;padding-bottom:.4rem}
  .panel{max-height:calc(100dvh - 5rem)}
  .text{min-height:3.1em;font-size:1rem}
  .bench{display:none}
  .cast{margin-top:.6rem}
  .choices{margin-top:.7rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
}

  const SCENE_BY_ID = new Map(scenes.map(function (scene) { return [scene.id, scene]; }));

  /* ==========================================================
     СОСТОЯНИЕ
     ========================================================== */
  const AUTO_KEY = "filosof_na_lavochke_auto_v1";
  const SLOT_KEY = "filosof_na_lavochke_slot_v1";
  const SAVE_PREFIX = "filosof_na_lavochke_slot_v2_";
  const SAVE_KEYS = [SAVE_PREFIX + "1", SAVE_PREFIX + "2", SAVE_PREFIX + "3"];
  const UNLOCK_KEY = "filosof_na_lavochke_endings_v1";

  function createState() {
    const copy = {};
    Object.keys(characters).forEach(function (id) {
      copy[id] = { affinity: 0, met: false };
    });
    return {
      sceneId: "d1_s1",
      day: 1,
      characters: copy,
      flags: {},
      finalStance: null
    };
  }

  let state = createState();
  let currentScene = null;
  let unlocked = readUnlocked();
  let busy = false;
  let galleryOpen = false;
  let savesOpen = false;
  let transitionTimer = null;

  /* ==========================================================
     DOM
     ========================================================== */
  const els = {
    body: document.body,
    dayLine: document.getElementById("dayLine"),
    panel: document.getElementById("panel"),

    savesSub: document.getElementById("savesSub"),
    savesList: document.getElementById("savesList"),
    closeSaves: document.getElementById("closeSaves"),
    restartBtn: document.getElementById("restartBtn"),
    galleryBtn: document.getElementById("galleryBtn"),
    gallery: document.getElementById("gallery"),
    galleryCount: document.getElementById("galleryCount"),

    stars: document.getElementById("stars")

  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ==========================================================
     ХРАНИЛИЩЕ
     ========================================================== */
  function readJSON(key) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (err) {
      return null;
    }
  }

  function writeJSON(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (err) {
      return false;
    }
  }

  function readUnlocked() {
    const data = readJSON(UNLOCK_KEY);
    if (!Array.isArray(data)) return [];
    return data.filter(function (id) { return ENDING_IDS.indexOf(id) !== -1; });
  }

  function registerEnding(id) {
    if (ENDING_IDS.indexOf(id) === -1) return;
    if (unlocked.indexOf(id) !== -1) return;
    unlocked.push(id);
    writeJSON(UNLOCK_KEY, unlocked);
  }

  function serialize() {
    const copy = {};
    Object.keys(state.characters).forEach(function (id) {
      copy[id] = {
        affinity: state.characters[id].affinity,
        met: state.characters[id].met
      };
    });
    return {
      v: 1,
      sceneId: state.sceneId,
      day: state.day,
      characters: copy,
      flags: Object.assign({}, state.flags),
      finalStance: state.finalStance
    };
  }

  function restore(data) {
    if (!data || typeof data !== "object") return false;
    if (typeof data.sceneId !== "string") return false;
    if (!SCENE_BY_ID.has(data.sceneId)) return false;

    const fresh = createState();
    if (data.characters && typeof data.characters === "object") {
      Object.keys(fresh.characters).forEach(function (id) {
        const saved = data.characters[id];
        if (!saved || typeof saved !== "object") return;
        const value = Number(saved.affinity);
        fresh.characters[id].affinity = isFinite(value) ? clamp(value, -5, 5) : 0;
        fresh.characters[id].met = Boolean(saved.met);
      });
    }
    if (data.flags && typeof data.flags === "object") {
      fresh.flags = Object.assign({}, data.flags);
    }
    if (typeof data.finalStance === "string") {
      fresh.finalStance = data.finalStance;
    }
    fresh.sceneId = data.sceneId;
    fresh.day = Number(data.day) || 1;
    state = fresh;
    return true;
  }

  function autosave() {
    writeJSON(AUTO_KEY, serialize());
  }

  /* ==========================================================
     МЕХАНИКА
     ========================================================== */
  function clamp(value, min, max) {
    return Math.min(max, Math.max(min, value));
  }

  function applyEffects(effects) {
    if (!effects) return;
    Object.keys(effects).forEach(function (id) {
      const target = state.characters[id];
      if (!target) return;
      const delta = Number(effects[id]);
      if (!isFinite(delta)) return;
      target.met = true;
      target.affinity = clamp(target.affinity + delta, -5, 5);
    });
  }

  function warmth() {
    return ["oldman", "girl", "boy", "suit", "lake", "under", "god"].reduce(function (sum, id) {
      return sum + state.characters[id].affinity;
    }, 0);
  }

  // Финал выбирается по отношениям и флагам, а не только по последнему клику.
  function getEnding() {
    const f = state.flags;
    const contradictions = [
      Boolean(f.believedGod && f.mockedGod),
      Boolean(f.phoneThrown && f.phoneAnswered),
      Boolean(f.boatLaunched && f.boatScoffed),
      Boolean(f.suitForgiven && f.suitRefused),
      Boolean(f.dealAccepted && f.dealRefused)
    ].filter(Boolean).length;

    if (contradictions >= 2) return "end_paradox";

    const w = warmth();
    const inner = state.characters.inner.affinity;

    if (state.finalStance === "self") {
      return inner >= 2 ? "end_self" : "end_paradox";
    }
    if (state.finalStance === "light") {
      if (w >= 8 && inner >= 2) return "end_light";
      if (w >= 2) return "end_balance";
      return "end_dark";
    }
    if (state.finalStance === "dark") {
      return "end_dark";
    }
    if (state.finalStance === "balance") {
      if (f.caughtStar) return "end_catch";
      return "end_balance";
    }
    return "end_balance";
  }

  /* ==========================================================
     ПЕРЕХОДЫ
     ========================================================== */
  function goToScene(id) {
    const scene = SCENE_BY_ID.get(id);
    if (!scene) {
      showBroken();
      return;
    }

    busy = true;
    cancelTyping();
    els.panel.classList.add("is-leaving");
    clearTimeout(transitionTimer);

    transitionTimer = setTimeout(function () {
      state.sceneId = scene.id;
      state.day = scene.day || state.day;
      if (scene.isEnding) registerEnding(scene.id);
      renderScene(scene);
      autosave();

      requestAnimationFrame(function () {
        els.panel.classList.remove("is-leaving");
        setTimeout(function () { busy = false; }, 260);
      });
    }, 200);
  }

  function selectChoice(choice) {
    if (busy) return;
    busy = true;

    applyEffects(choice.effects);
    if (choice.flags && typeof choice.flags === "object") {
      Object.assign(state.flags, choice.flags);
    }

    if (choice.final) {
      state.finalStance = choice.stance || "balance";
      const endingId = getEnding();
      busy = false;
      goToScene(endingId);
      return;
    }

    if (choice.next) {
      busy = false;
      goToScene(choice.next);
    } else {
      busy = false;
      goToScene(getEnding());
    }
  }

  /* ==========================================================
     РЕНДЕР
     ========================================================== */
  function findCharacterId(speaker) {
    const keys = Object.keys(characters);
    for (let i = 0; i < keys.length; i += 1) {
      if (characters[keys[i]].name === speaker) return keys[i];
    }
    return "narrator";
  }

  function portraitMarkup(id) {
    return '<svg viewBox="0 0 120 120" aria-hidden="true" focusable="false"><use href="#p-' + id + '"></use></svg>';
  }

  function renderPortrait(speaker) {
    const id = findCharacterId(speaker);
    els.portrait.innerHTML = portraitMarkup(id);
    els.speakerRole.textContent = characters[id] ? characters[id].role : "голос за кадром";
  }

  function renderScene(scene) {
    currentScene = scene;

    els.body.dataset.scene = scene.id;
    els.body.dataset.bg = scene.background || "fog";
    els.body.classList.toggle("rod-out", Boolean(scene.rod));
    els.dayLine.textContent = "День " + (scene.day || state.day) + " · " + (BG_LABEL[scene.background] || "Туман");
    els.speaker.textContent = scene.speaker || "Рассказчик";
    els.sceneNo.textContent = scene.isEnding ? "Финал" : "";
    renderPortrait(scene.speaker || "Рассказчик");

    renderCast(scene.cast || []);

    els.endingHead.hidden = !scene.isEnding;
    els.endingKicker.textContent = scene.broken ? "Конец" : "Финал";
    els.endingTitle.textContent = scene.title || "";
    els.endingFoot.hidden = true;
    els.choices.innerHTML = "";
    els.choices.classList.add("is-hidden");

    if (!scene.isEnding) {
      renderChoices(scene, true);
    }

    typeText(scene.text, function () {
      if (scene.isEnding) {
        els.endingFoot.hidden = false;
        els.unlocked.textContent = scene.broken
          ? "Сцена не нашлась. Но озеро на месте."
          : "Открыто финалов: " + unlocked.length + " из " + ENDING_IDS.length;
        els.live.textContent = "Финал. " + (scene.title || "Конец") + ". " + scene.text;
      } else {
        els.choices.classList.remove("is-hidden");
        els.live.textContent = (scene.speaker || "Рассказчик") + ". " + scene.text;
      }
    });
  }

  function renderCast(ids) {
    els.cast.innerHTML = "";
    if (!ids || !ids.length) {
      els.cast.hidden = true;
      return;
    }
    els.cast.hidden = false;

    ids.forEach(function (id) {
      const meta = characters[id];
      const data = state.characters[id];
      if (!meta || !data) return;
      data.met = true;

      const chip = document.createElement("span");
      chip.className = "chip";

      const avatar = document.createElement("span");
      avatar.className = "chip-avatar";
      avatar.innerHTML = portraitMarkup(id);
      chip.appendChild(avatar);

      const who = document.createElement("span");
      who.className = "who";
      who.textContent = meta.name;
      chip.appendChild(who);

      const pips = document.createElement("span");
      pips.className = "pips";
      const filled = Math.min(5, Math.abs(data.affinity));
      for (let i = 0; i < 5; i += 1) {
        const pip = document.createElement("i");
        pip.className = "pip";
        if (i < filled) {
          pip.classList.add("on");
          if (data.affinity < 0) pip.classList.add("neg");
        }
        pips.appendChild(pip);
      }
      chip.appendChild(pips);

      const signed = (data.affinity > 0 ? "+" : "") + data.affinity;
      chip.title = meta.name + ": " + signed;
      chip.setAttribute("aria-label", meta.name + ", отношение " + signed);
      els.cast.appendChild(chip);
    });
  }

  function renderChoices(scene, hidden) {
    els.choices.innerHTML = "";

    const list = (scene.choices || []).filter(function (choice) {
      if (typeof choice.when === "function") {
        try {
          return Boolean(choice.when(state));
        } catch (err) {
          return true;
        }
      }
      return true;
    });

    list.forEach(function (choice, index) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "choice" + (choice.final ? " is-final" : "");

      const num = document.createElement("span");
      num.className = "num";
      num.textContent = String(index + 1);

      const label = document.createElement("span");
      label.className = "label";
      label.textContent = choice.text;

      btn.appendChild(num);
      btn.appendChild(label);
      btn.addEventListener("click", function () {
        selectChoice(choice);
      });

      els.choices.appendChild(btn);
    });

    if (hidden) {
      els.choices.classList.add("is-hidden");
    } else {
      els.choices.classList.remove("is-hidden");
    }
  }

  /* ==========================================================
     ГАЛЕРЕЯ ПЕРСОНАЖЕЙ
     ========================================================== */
  function buildPips(affinity) {
    const pips = document.createElement("span");
    pips.className = "pips";
    const filled = Math.min(5, Math.abs(affinity));
    for (let i = 0; i < 5; i += 1) {
      const pip = document.createElement("i");
      pip.className = "pip";
      if (i < filled) {
        pip.classList.add("on");
        if (affinity < 0) pip.classList.add("neg");
      }
      pips.appendChild(pip);
    }
    return pips;
  }

  function renderGallery() {
    els.galleryGrid.innerHTML = "";
    const ids = Object.keys(characters);
    let metCount = 0;

    ids.forEach(function (id) {
      const meta = characters[id];
      const data = state.characters[id];
      const met = Boolean(data.met);
      if (met) metCount += 1;

      const card = document.createElement("article");
      card.className = "person-card" + (met ? "" : " is-locked");

      const portrait = document.createElement("div");
      portrait.className = "person-portrait";
      portrait.innerHTML = portraitMarkup(id);
      card.appendChild(portrait);

      const copy = document.createElement("div");
      copy.className = "person-copy";

      const name = document.createElement("h3");
      name.className = "person-name";
      name.textContent = met ? meta.name : "???";
      copy.appendChild(name);

      const role = document.createElement("p");
      role.className = "person-role";
      role.textContent = met ? meta.role : "Вы ещё не встретились.";
      copy.appendChild(role);

      if (met) {
        const pips = buildPips(data.affinity);
        const signed = (data.affinity > 0 ? "+" : "") + data.affinity;
        pips.title = "Отношение: " + signed;
        copy.appendChild(pips);
      }

      card.appendChild(copy);
      els.galleryGrid.appendChild(card);
    });

    els.galleryCount.textContent = "Знакомы: " + metCount + " из " + ids.length +
      " · финалов открыто: " + unlocked.length + " из " + ENDING_IDS.length;
  }

  function openGallery() {
    if (galleryOpen) return;
    if (savesOpen) closeSaves();
    galleryOpen = true;
    renderGallery();
    els.gallery.hidden = false;
    els.galleryBtn.classList.add("is-active");
    els.closeGallery.focus();
  }

  function closeGallery() {
    if (!galleryOpen) return;
    galleryOpen = false;
    els.gallery.hidden = true;
    els.galleryBtn.classList.remove("is-active");
    els.galleryBtn.focus();
  }

  /* ==========================================================
     ПЕЧАТЬ ТЕКСТА
     ========================================================== */
  let typingTimer = null;
  let typingDone = null;
  let isTyping = false;

  function typeText(text, onDone) {
    cancelTyping();
    isTyping = true;
    typingDone = onDone;
    els.text.textContent = "";
    els.text.classList.add("is-typing");

    if (reduceMotion || !text) {
      endTyping();
      return;
    }

    let index = 0;
    typingTimer = setInterval(function () {
      index = Math.min(text.length, index + 2);
      els.text.textContent = text.slice(0, index);
      if (index >= text.length) endTyping();
    }, 17);
  }

  function endTyping() {
    if (!isTyping) return;
    clearInterval(typingTimer);
    typingTimer = null;
    isTyping = false;
    els.text.classList.remove("is-typing");
    if (currentScene) els.text.textContent = currentScene.text;

    const callback = typingDone;
    typingDone = null;
    if (callback) callback();
  }

  function cancelTyping() {
    clearInterval(typingTimer);
    typingTimer = null;
    isTyping = false;
    typingDone = null;
    els.text.classList.remove("is-typing");
  }

  /* ==========================================================
     ОШИБКИ И СЛУЖЕБНЫЕ ЭКРАНЫ
     ========================================================== */
  function showBroken() {
    cancelTyping();
    busy = false;
    state.sceneId = "__broken";
    const broken = {
      id: "__broken",
      day: state.day || 1,
      background: "fog",
      speaker: "Рассказчик",
      cast: [],
      isEnding: true,
      broken: true,
      title: "Конец",
      text: `Сцена потерялась в тумане. Так бывает даже в историях.
Озеро осталось. Лавочка осталась. Даже этот вечер остался.
Можно начать заново. Озеро не против.`
    };
    currentScene = broken;
    els.body.dataset.bg = "fog";
    els.body.classList.remove("rod-out");
    els.dayLine.textContent = "День ? · Туман";
    els.speaker.textContent = "Рассказчик";
    els.speakerRole.textContent = "голос за кадром";
    els.portrait.innerHTML = portraitMarkup("narrator");
    els.sceneNo.textContent = "Конец";
    renderCast([]);
    els.endingHead.hidden = false;
    els.endingKicker.textContent = "Конец";
    els.endingTitle.textContent = "Конец";
    els.choices.innerHTML = "";
    els.choices.classList.add("is-hidden");
    els.endingFoot.hidden = false;
    els.unlocked.textContent = "Сцена не нашлась. Но озеро на месте.";
    typeText(broken.text, function () {
      els.live.textContent = broken.text;
    });
  }

  function showToast(message) {
    els.toast.textContent = message;
    els.toast.classList.add("is-visible");
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(function () {
      els.toast.classList.remove("is-visible");
    }, 2400);
  }

  /* ==========================================================
     СОХРАНЕНИЯ / ЗАГРУЗКА / СБРОС
     ========================================================== */
  let armedDelete = -1;
  let deleteTimer = null;

  function slotPayload(index) {
    const raw = readJSON(SAVE_KEYS[index]);
    if (!raw || typeof raw !== "object") return null;
    if (raw.data && typeof raw.data === "object" && typeof raw.data.sceneId === "string") {
      return { savedAt: raw.savedAt || null, data: raw.data };
    }
    // Совместимость со старым одиночным слотом.
    if (typeof raw.sceneId === "string") {
      return { savedAt: null, data: raw };
    }
    return null;
  }

  function describeData(data) {
    const scene = data && SCENE_BY_ID.get(data.sceneId);
    const day = (data && data.day) || (scene ? scene.day : 1);
    const bg = scene && scene.background ? (BG_LABEL[scene.background] || "Туман") : "Туман";
    const title = scene
      ? (scene.isEnding ? scene.title : (scene.speaker || "Рассказчик"))
      : "Сцена";
    const snippet = scene ? scene.text.replace(/\s+/g, " ").slice(0, 92) + "…" : "";
    return {
      day: day,
      bg: bg,
      title: title,
      snippet: snippet,
      ending: Boolean(scene && scene.isEnding)
    };
  }

  function formatSavedAt(iso) {
    if (!iso) return "ранее";
    const date = new Date(iso);
    if (isNaN(date.getTime())) return "ранее";
    try {
      return date.toLocaleString("ru-RU", {
        day: "numeric",
        month: "short",
        hour: "2-digit",
        minute: "2-digit"
      });
    } catch (err) {
      return "ранее";
    }
  }

  function migrateLegacySlot() {
    if (readJSON(SAVE_KEYS[0])) return;
    const legacy = readJSON(SLOT_KEY);
    if (legacy && typeof legacy.sceneId === "string" && SCENE_BY_ID.has(legacy.sceneId)) {
      if (writeJSON(SAVE_KEYS[0], { v: 2, savedAt: null, data: legacy })) {
        try {
          localStorage.removeItem(SLOT_KEY);
        } catch (err) {
          // Старый слот просто останется лежать, игра его больше не читает.
        }
      }
    }
  }

  function saveToSlot(index) {
    if (!SCENE_BY_ID.has(state.sceneId)) {
      showToast("Сейчас сохранять нечего. Озеро разводит руками.");
      return;
    }
    const payload = {
      v: 2,
      savedAt: new Date().toISOString(),
      data: serialize()
    };
    armedDelete = -1;
    if (writeJSON(SAVE_KEYS[index], payload)) {
      renderSaves();
      showToast("Сохранено в слот " + (index + 1) + ".");
    } else {
      showToast("Браузер не разрешил сохранить.");
    }
  }

  function loadFromSlot(index) {
    const slot = slotPayload(index);
    if (!slot || !restore(slot.data)) {
      showToast("Этот слот пуст. Как озеро зимой.");
      return;
    }
    clearTimeout(transitionTimer);
    busy = false;
    closeSaves();
    showToast("Загружено из слота " + (index + 1) + ".");
    goToScene(state.sceneId);
  }

  function requestDeleteSlot(index) {
    if (armedDelete !== index) {
      armedDelete = index;
      renderSaves();
      clearTimeout(deleteTimer);
      deleteTimer = setTimeout(function () {
        armedDelete = -1;
        if (savesOpen) renderSaves();
      }, 2600);
      return;
    }
    try {
      localStorage.removeItem(SAVE_KEYS[index]);
    } catch (err) {
      // Ничего страшного: просто не удалилось.
    }
    armedDelete = -1;
    renderSaves();
    showToast("Слот " + (index + 1) + " очищен.");
  }

  function renderSaves() {
    if (!els.savesList) return;
    const current = describeData(serialize());
    els.savesSub.textContent = "Сейчас: День " + current.day + " · " + current.bg +
      ", " + current.title + ". Автосохранение идёт само.";
    els.savesList.innerHTML = "";

    SAVE_KEYS.forEach(function (key, index) {
      const slot = slotPayload(index);
      const card = document.createElement("article");
      card.className = "save-card" + (slot ? "" : " is-empty");

      const top = document.createElement("div");
      top.className = "save-top";
      const slotName = document.createElement("span");
      slotName.className = "save-slot";
      slotName.textContent = "Слот " + (index + 1);
      const time = document.createElement("span");
      time.className = "save-time";
      time.textContent = slot ? formatSavedAt(slot.savedAt) : "пусто";
      top.appendChild(slotName);
      top.appendChild(time);
      card.appendChild(top);

      const title = document.createElement("h3");
      title.className = "save-scene";
      const meta = document.createElement("div");
      meta.className = "save-meta";

      let snippetText = "";
      if (slot) {
        const info = describeData(slot.data);
        title.textContent = (info.ending ? "Финал: " : "") + info.title;
        meta.textContent = "День " + info.day + " · " + info.bg;
        snippetText = info.snippet;
      } else {
        title.textContent = "Пока ничего";
        meta.textContent = "Озеро не хранит чужие сны. Сохраните этот момент.";
      }
      card.appendChild(title);
      card.appendChild(meta);
      if (snippetText) {
        const snippet = document.createElement("p");
        snippet.className = "save-snippet";
        snippet.textContent = snippetText;
        card.appendChild(snippet);
      }

      const actions = document.createElement("div");
      actions.className = "save-actions";

      const saveBtn = document.createElement("button");
      saveBtn.type = "button";
      saveBtn.className = "primary small";
      saveBtn.textContent = slot ? "Перезаписать" : "Сохранить";
      saveBtn.addEventListener("click", function () {
        saveToSlot(index);
      });
      actions.appendChild(saveBtn);

      if (slot) {
        const loadBtn = document.createElement("button");
        loadBtn.type = "button";
        loadBtn.className = "ghost small";
        loadBtn.textContent = "Загрузить";
        loadBtn.addEventListener("click", function () {
          loadFromSlot(index);
        });
        actions.appendChild(loadBtn);

        const deleteBtn = document.createElement("button");
        deleteBtn.type = "button";
        deleteBtn.className = "ghost small danger";
        deleteBtn.textContent = armedDelete === index ? "Точно?" : "Удалить";
        deleteBtn.addEventListener("click", function () {
          requestDeleteSlot(index);
        });
        actions.appendChild(deleteBtn);
      }

      card.appendChild(actions);
      els.savesList.appendChild(card);
    });
  }

  function openSaves() {
    if (savesOpen) return;
    if (galleryOpen) closeGallery();
    savesOpen = true;
    armedDelete = -1;
    renderSaves();
    els.saves.hidden = false;
    els.savesBtn.classList.add("is-active");
    els.closeSaves.focus();
  }

  function closeSaves() {
    if (!savesOpen) return;
    savesOpen = false;
    armedDelete = -1;
    clearTimeout(deleteTimer);
    els.saves.hidden = true;
    els.savesBtn.classList.remove("is-active");
    els.savesBtn.focus();
  }

  function resetGame() {
    cancelTyping();
    clearTimeout(transitionTimer);
    busy = false;
    state = createState();
    try {
      localStorage.removeItem(AUTO_KEY);
    } catch (err) {
      // Хранилище может быть недоступно — игра продолжится без автосохранения.
    }
    disarmRestart();
    showToast("Новая история. Озеро делает вид, что не узнаёт.");
    goToScene("d1_s1");
  }

  /* ==========================================================
     КНОПКИ
     ========================================================== */
  let restartTimer = null;

  function disarmRestart() {
    els.restartBtn.textContent = "Заново";
    els.restartBtn.classList.remove("is-armed");
    els.restartBtn.dataset.armed = "0";
  }

  els.restartBtn.addEventListener("click", function () {
    if (els.restartBtn.dataset.armed === "1") {
      clearTimeout(restartTimer);
      resetGame();
      return;
    }
    els.restartBtn.dataset.armed = "1";
    els.restartBtn.textContent = "Точно?";
    els.restartBtn.classList.add("is-armed");
    clearTimeout(restartTimer);
    restartTimer = setTimeout(disarmRestart, 2600);
  });

  els.restartEnding.addEventListener("click", resetGame);
  els.galleryBtn.addEventListener("click", openGallery);
  els.closeGallery.addEventListener("click", closeGallery);
  els.gallery.querySelector("[data-close-gallery]").addEventListener("click", closeGallery);
  els.savesBtn.addEventListener("click", openSaves);
  els.closeSaves.addEventListener("click", closeSaves);
  els.saves.querySelector("[data-close-saves]").addEventListener("click", closeSaves);

  /* ==========================================================
     ВВОД
     ========================================================== */
  els.panel.addEventListener("click", function (event) {
    if (event.target.closest("button")) return;
    if (isTyping) endTyping();
  });

  document.addEventListener("keydown", function (event) {
    if (savesOpen) {
      if (event.key === "Escape") {
        event.preventDefault();
        closeSaves();
      }
      return;
    }
    if (galleryOpen) {
      if (event.key === "Escape") {
        event.preventDefault();
        closeGallery();
      }
      return;
    }
    if (event.key === "Escape") return;
    if (isTyping && (event.key === " " || event.key === "Enter")) {
      event.preventDefault();
      endTyping();
      return;
    }
    if (isTyping) return;
    if (!els.choices.classList.contains("is-hidden")) {
      const number = parseInt(event.key, 10);
      if (number >= 1 && number <= 4) {
        const buttons = els.choices.querySelectorAll(".choice");
        if (buttons[number - 1]) {
          event.preventDefault();
          buttons[number - 1].click();
        }
      }
    }
  });

  /* ==========================================================
     ЗВЁЗДЫ
     ========================================================== */
  function buildStars() {
    const fragment = document.createDocumentFragment();
    for (let i = 0; i < 90; i += 1) {
      const star = document.createElement("span");
      star.className = "star";
      star.style.left = (Math.random() * 100).toFixed(2) + "%";
      star.style.top = (Math.random() * 66).toFixed(2) + "%";
      star.style.setProperty("--dur", (2 + Math.random() * 4).toFixed(2) + "s");
      star.style.setProperty("--delay", (-Math.random() * 6).toFixed(2) + "s");
      const size = Math.random() < 0.14 ? "2.6px" : "1.6px";
      star.style.width = size;
      star.style.height = size;
      fragment.appendChild(star);
    }
    els.stars.appendChild(fragment);
  }

  /* ==========================================================
     СТАРТ
     ========================================================== */
  function boot() {
    buildStars();
    migrateLegacySlot();

    const auto = readJSON(AUTO_KEY);
    if (auto && restore(auto)) {
      showToast("Продолжаем. Озеро не забыло.");
      goToScene(state.sceneId);
    } else {
      state = createState();
      showToast("Клик по тексту — дочитать сразу. Выбор — внизу.");
      goToScene("d1_s1");
    }
  }

  boot();
})();
</script>
</body>
</html>
